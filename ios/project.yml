# XcodeGen projesi — OwnMemories (iOS 17+). Oluşturmak için:  xcodegen generate
# Sözleşme: ../docs/ARCHITECTURE.md
name: OwnMemories

options:
  bundleIdPrefix: net.balkay
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  OwnMemories:
    type: application
    platform: iOS
    sources:
      - path: OwnMemories
        excludes:
          - "Info.plist"
          - "OwnMemories.entitlements"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: OwnMemories/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Core/Sources/OwnMemoriesCore
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OwnMemories
        PRODUCT_BUNDLE_IDENTIFIER: net.balkay.ownmemories
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OwnMemories/Info.plist
        CODE_SIGN_ENTITLEMENTS: OwnMemories/OwnMemories.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: OwnMemoriesWidgets
        embed: true
        codeSign: true
      - sdk: Photos.framework
      - sdk: BackgroundTasks.framework
      - sdk: AVKit.framework
      - sdk: Network.framework
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework

  OwnMemoriesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OwnMemoriesWidgets
        excludes:
          - "Info.plist"
          - "OwnMemoriesWidgets.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OwnMemoriesWidgets
        PRODUCT_BUNDLE_IDENTIFIER: net.balkay.ownmemories.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OwnMemoriesWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: OwnMemoriesWidgets/OwnMemoriesWidgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  OwnMemories:
    build:
      targets:
        OwnMemories: all
        OwnMemoriesWidgets: [running, profiling, analyzing, archiving]
    run:
      config: Debug
    archive:
      config: Release
