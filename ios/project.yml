# XcodeGen projesi — OwnMemories (iOS 17+). Oluşturmak için:  xcodegen generate
# Sözleşme: ../docs/ARCHITECTURE.md
name: OwnMemories

options:
  bundleIdPrefix: net.balkay
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  OwnMemories:
    type: application
    platform: iOS
    sources:
      - path: OwnMemories
        excludes:
          - "Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
      - path: OwnMemories/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Core/Sources/OwnMemoriesCore
    settings:
      base:
        PRODUCT_NAME: OwnMemories
        PRODUCT_BUNDLE_IDENTIFIER: net.balkay.ownmemories
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OwnMemories/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - sdk: Photos.framework
      - sdk: BackgroundTasks.framework
      - sdk: AVKit.framework
      - sdk: Network.framework

schemes:
  OwnMemories:
    build:
      targets:
        OwnMemories: all
    run:
      config: Debug
    archive:
      config: Release
