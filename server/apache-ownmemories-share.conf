# OwnMemories — herkese açık paylaşım sitesi (yalnızca /s/... bağlantıları). server/setup-share.sh kurar:
#   /etc/apache2/sites-available/ownmemories-share.conf  (__DEST__ ve __PORT__ doldurulur)
# Yalnızca 127.0.0.1'de dinler; dışarıya Tailscale Funnel ile YALNIZCA bu port açılır:
#   tailscale funnel --bg --https=8443 http://127.0.0.1:__PORT__
# Ana uygulama, giriş, yönetim ve API bu siteden erişilemez: DocumentRoot yalnızca web/s'tir ve her istek
# paylaşım ön denetleyicisine (web/s/index.php) gider.
Listen 127.0.0.1:__PORT__

<VirtualHost 127.0.0.1:__PORT__>
    ServerName ownmemories-share.local
    DocumentRoot __DEST__/web/s

    # Üst klasör (ana site) kapalı; .htaccess dosyaları okunmaz.
    <Directory __DEST__/web>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory __DEST__/web/s>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # Ana sitenin klasörleri ve gizli dosyalar hiçbir koşulda sunulmaz.
    <LocationMatch "^/(includes|install|config|storage|lang|api|admin|app)(/|$)">
        Require all denied
    </LocationMatch>

    RewriteEngine On
    RewriteRule ^ /index.php [L]

    # Gerçek ziyaretçi IP'si (hız sınırları için): yalnızca yerel vekilin (tailscaled) eklediği başlığa güvenilir.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1 ::1
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    # Yalnızca parola formu gönderilir; zip akışı sıkıştırılmaz.
    LimitRequestBody 65536
    SetEnv no-gzip 1
    Header always unset X-Powered-By
    <IfModule mod_php.c>
        php_admin_flag expose_php off
        php_admin_flag display_errors off
        php_admin_value max_execution_time 0
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ownmemories-share-error.log
    CustomLog ${APACHE_LOG_DIR}/ownmemories-share-access.log combined
</VirtualHost>
