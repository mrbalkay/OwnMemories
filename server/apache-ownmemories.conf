# /etc/apache2/sites-available/ownmemories.conf
<VirtualHost *:80>
    ServerName ownmemories.balkay.net
    ServerAlias localhost
    DocumentRoot /var/www/ownmemories/web

    <Directory /var/www/ownmemories/web>
        AllowOverride All
        Require all granted
    </Directory>

    # Cloudflare Tunnel arkasında gerçek istemci IP'si
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 127.0.0.1 ::1
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    # 50 MB parçalar + pay
    LimitRequestBody 60000000
    Timeout 300

    ErrorLog ${APACHE_LOG_DIR}/ownmemories-error.log
    CustomLog ${APACHE_LOG_DIR}/ownmemories-access.log combined
</VirtualHost>
